# 聚氯乙烯（PVC）常见型号。查阅日期 2026-11-08。

grades:
  - code: SG-5
    full_name: 悬浮法通用型聚氯乙烯树脂 SG5 型
    producers: 国内绝大多数 PVC 生产企业都生产（电石法、乙烯法都有）
    material: PVC
    product_type: resin
    grade_class: 通用型（悬浮法）
    lifecycle: active
    verify: unverified
    aliases: [SG5, SG 5, 5型, 五型, PVC SG5]
    summary: 国内用量最大的 PVC 型号，大商所 PVC 期货的交割标准品就是 SG5 型一等品。
    description: |
      SG-5 不是某一家厂的牌号，而是国家标准 **GB/T 5761《悬浮法通用型聚氯乙烯树脂》** 里的一个**型号**：
      - **S**：悬浮法（Suspension）生产；**G**：通用型（General）；
      - 后面的数字 1～8 按分子量（黏数、K 值、聚合度）从高到低排，**数字越小分子量越高**。

      SG-5 的分子量居中，K 值 66～68，主要用来做**硬制品**：管材、型材（门窗）、板材、管件。
      软制品（电线皮、薄膜、人造革）多用分子量更高的 SG-3。

      **和期货的关系**：大连商品交易所 PVC 期货的标准品是“符合 GB/T 5761-2018 的 SG5 型一等品”，
      优等品可以替代交割。所以看 PVC 期货价，实际看的就是 SG-5 的价格。

      下面的指标是标准规定的范围（规格值），来自供应商页面引用的 GB/T 5761-2006，
      **现行标准是 2018 版**，个别指标可能有调整，正式使用请查标准原文。
      有的企业写黏数 110～118，比国标 107～118 更窄，那是企业自己的内控范围。
    sources:
