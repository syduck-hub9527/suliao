      - {id: jh, title: "PVC 树脂 SG3/SG5/SG8 规格表", url: "https://nl.jinhetec.com/pvc-resin/57917819.html", publisher: Jinhe（供应商）, kind: trader, accessed: 2026-11-08}
      - {id: dce, title: 大连商品交易所聚氯乙烯期货业务细则（2025 年修订公告附件）, url: "https://np-newsimg.dfcfw.com/download/A2_cms_f_20250714170458634336?direct=1", publisher: 大连商品交易所（东方财富网转载）, kind: exchange, accessed: 2026-11-08}
    properties:
