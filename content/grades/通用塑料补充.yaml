  # ================= EVOH =================
  - code: F171B
    full_name: EVAL F171B
    manufacturer: 可乐丽
    brand: EVAL
    material: EVOH
    grade_class: 标准级，乙烯 32 mol%
    verify: verified
    aliases: [F171, EVAL F171]
    summary: EVOH 的标准牌号，乙烯含量 32 mol%，阻隔性和长时间开机稳定性好，用于瓶、片材、薄膜、管材。
    description: |
      EVOH 按**乙烯含量**分档：乙烯越少阻隔越好、越难加工；乙烯越多越柔软好加工、阻隔变差。
      可乐丽 EVAL 的字母就代表乙烯档次：**L 型 27%，F 型 32%，H 型 38%，E 型 44%，G 型 48%**（mol%）。
      可乐丽 1972 年在全球率先工业化生产 EVOH。
    sources:
      - &eval_web {id: eval, title: EVAL 产品页（可乐丽）, url: "https://kuraray.com/products/eval", publisher: Kuraray, kind: maker_web, accessed: 2026-11-10}
      - &eval_us {id: evalus, title: 可乐丽：EVAL 牌号与阻隔数据, url: "https://kuraray.us.com/wp-content/uploads/2023/03/Silage-Covers-with-EVAL%E2%84%A2-Ethylene-Vinyl-Alcohol_Edgard-Chow.pdf", publisher: Kuraray America, kind: maker_doc, accessed: 2026-11-10}
    properties:
      - {prop: 密度, value: "1.19", unit: g/cm³, source: evalus}
      - {prop: 熔点, value: "183", unit: °C, source: evalus}
  - code: E171B
