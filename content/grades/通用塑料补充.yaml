  # ================= UHMWPE =================
  - code: GUR 4120
    full_name: GUR 4120
    manufacturer: 塞拉尼斯
    brand: GUR
    material: UHMWPE
    grade_class: 粉料，板材/型材级
    verify: partial
    aliases: [GUR4120, "4120"]
    summary: 塞拉尼斯的 UHMWPE 粉料，用于压制板材、柱塞挤出型材、多孔烧结件，也做过滤件和 PP/PE 薄膜添加剂。
    description: |
      UHMWPE 分子量极高，熔了也几乎不流动，所以多以**粉料**供货，靠模压、柱塞挤出、烧结成型，普通注塑很难。
      GUR 4150 分子量更高（厂家按 Margolies 公式算约 870 万 g/mol），耐磨性在标准牌号里最好之一。
    sources:
      - {id: g4120, title: "GUR 4120（UL Prospector）", url: "https://betaplastics.ulprospector.com/plastics/en/datasheet/18996/gur-4120", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
      - &gur_sc {id: gsc, title: "GUR 产品列表（SpecialChem）", url: "https://www.specialchem.com/plastics/supplier/celanese/gur", publisher: SpecialChem, kind: other, accessed: 2026-11-10}
  - code: GUR 4150
    full_name: GUR 4150
    manufacturer: 塞拉尼斯
    brand: GUR
    material: UHMWPE
    grade_class: 粉料，高分子量
    verify: partial
    aliases: [GUR4150, "4150"]
    summary: 更高分子量的 UHMWPE 粉料，耐磨、抗冲击极好、摩擦系数低，用于板材和型材。
    sources:
      - {id: g4150, title: "GUR 4150（SpecialChem）", url: "https://www.specialchem.com/plastics/product/celanese-gur-4150", publisher: SpecialChem, kind: other, accessed: 2026-11-10}

