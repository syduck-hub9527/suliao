  # ================= PVC =================
  - code: TK-1000
    full_name: 信越 PVC TK-1000
    manufacturer: 信越化学
    material: PVC
    grade_class: 通用型（悬浮法）
    verify: partial
    aliases: [TK1000, 信越 TK-1000, Shin-Etsu TK-1000]
    summary: 信越化学的通用 PVC 树脂，K 值 67、平均聚合度约 1030，用于管材、型材、压延膜、电线电缆。
