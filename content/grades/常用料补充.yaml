  # ================= PS =================
  - code: 158K
    full_name: Styrolution PS 158K
    manufacturer: 英力士苯领
    brand: Styrolution PS
    material: GPPS
    grade_class: 耐热通用级
    verify: partial
    aliases: [PS 158K, Styrolution 158K, 158K GPPS]
    summary: 英力士苯领的耐热 GPPS，冷却定型快，用于发泡片材和薄膜，也常和 HIPS 或 Styrolux 共混。
    description: |
      GPPS（透明 PS）本身很脆，所以常和 HIPS 共混来做一次性餐具、杯子，和 Styrolux（苯乙烯-丁二烯透明共聚物）共混做透明又耐冲击的制品。
      158K 的卖点是耐热和“快速冷却”，资料推荐用于发泡片材。英力士苯领还有 158N/L 等相近牌号（SpecialChem 有列）。
      下面的数据来自英力士苯领亚洲的 TDS（2016 年版，挂在第三方网站上），所以只算“部分核实”。
    sources:
      - {id: tds, title: "Styrolution PS 158K TDS（INEOS Styrolution 亚洲，2016）", url: "https://plasticker.de/docs/recybase/3644_1783596902.pdf", publisher: INEOS Styrolution（plasticker.de 转载）, kind: maker_doc, accessed: 2026-11-10}
