  # ================= PE =================
  - code: 218W
    full_name: SABIC LLDPE 218W
    manufacturer: 沙特基础工业
    material: LLDPE
    grade_class: 吹膜级
    verify: partial
    aliases: [SABIC 218W, LLDPE 218W, 沙比克 218W]
    summary: SABIC 的丁烯共聚 LLDPE 通用包装膜料，加了爽滑剂和开口剂。
    description: |
      SABIC 的 218 系列是一组 LLDPE 薄膜料，后面的字母代表不同的添加剂组合（在 SABIC 官网搜“218”能看到整个系列）。
      218W 含爽滑剂约 1500 ppm、开口剂约 3500 ppm——**爽滑剂**让薄膜表面滑、好开袋，**开口剂**防止两层膜粘在一起。
      做自动包装、需要膜表面滑的客户会关心这两个添加剂；做复合、印刷的客户反而可能要不含爽滑剂的版本。
    sources:
      - {id: sc, title: "SABIC LLDPE 218W（SpecialChem）", url: "https://www.specialchem.com/plastics/product/sabic-sabic-lldpe-218w", publisher: SpecialChem（数据库）, kind: other, accessed: 2026-11-10}
      - {id: web, title: "SABIC 产品搜索：218", url: "https://sabic.com/en/search/products-search?q=218", publisher: SABIC, kind: maker_web, accessed: 2026-11-10}

  - code: "1018"
    full_name: Exceed 1018
    manufacturer: 埃克森美孚
    brand: Exceed
    material: LLDPE
    grade_class: 吹膜级（茂金属）
    verify: partial
    aliases: [Exceed 1018, 埃克森 1018, mLLDPE 1018]
    summary: 埃克森美孚的茂金属线性低密度聚乙烯（mLLDPE），乙烯-己烯共聚，密度 0.918。
    description: |
      “茂金属”是指聚合时用的催化剂。茂金属 PE 的分子更均匀，做出来的薄膜**更韧、更抗穿刺、热封更好**，
      常和普通 LLDPE、LDPE 共混吹膜，用在重包装膜、拉伸膜等。

      1018 是一个系列，后面再加字母表示不同的添加剂版本，报价时要问清楚具体是哪个。
      这份资料是网友上传到 Scribd 的厂家资料，只算“部分核实”。
    sources:
      - {id: scribd, title: "Exceed 1018 Series（Scribd 上传的厂家资料）", url: "https://www.scribd.com/document/564078075/Exceed-1018-Series", publisher: Scribd（用户上传）, kind: other, accessed: 2026-11-10}
    properties:
      - {prop: 密度, value: "0.918", unit: g/cm³, source: scribd}

