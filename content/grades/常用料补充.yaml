  # ================= PP 均聚 =================
  - code: HP500N
    full_name: Moplen HP500N
    manufacturer: 利安德巴赛尔
    brand: Moplen
    material: PP-H
    grade_class: 通用注塑级
    verify: partial
    aliases: [Moplen HP500N, HP500N B]
    summary: 利安德巴赛尔的均聚 PP 通用注塑料，流动性好、刚性好，可用于食品接触。MFR 12。
    description: |
      Moplen 是利安德巴赛尔的聚丙烯品牌。HP 开头的是均聚 PP（Homopolymer），EP 开头的是抗冲共聚 PP，RP 开头的是无规共聚 PP——
      这一点从本库收录的 HP500N、EP548R 和 UL Prospector 里的 RP241R（无规共聚）都能看出来。

      下面的数据来自利安德巴赛尔的 TDS（标题是“Moplen HP500N B”），但文件挂在一家贸易商网站上，所以只算“部分核实”。
