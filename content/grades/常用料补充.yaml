  - code: SG-3
    full_name: 悬浮法通用型聚氯乙烯树脂 SG3 型
    producers: 国内多数 PVC 生产企业都有（按 GB/T 5761 分型）
    material: PVC
    product_type: resin
    grade_class: 通用型（悬浮法）
    verify: unverified
    aliases: [SG3, SG 3, 3型, 三型, PVC SG3]
    summary: 分子量比 SG-5 高的 PVC 型号，主要做软制品：电线电缆料、农膜、日用软制品。
    description: |
      和 SG-5 一样，SG-3 是国标 GB/T 5761 里的**型号**，不是哪家的专有牌号（现行版本是 2018 版）。
      数字越小分子量越高：SG-3 分子量高，加增塑剂后做**软制品**韧性更好，所以电线电缆、薄膜多用它。
      K 值来自贸易商页面，只作参考，正式数值请查国标原文。
    sources:
      - *pvc_types
      - *gb5761
    properties:
      - {prop: K 值, value: "71～72", source: pvctypes}

  - code: SG-8
    full_name: 悬浮法通用型聚氯乙烯树脂 SG8 型
    producers: 国内多家 PVC 生产企业（按 GB/T 5761 分型）
