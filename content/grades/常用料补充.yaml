    product_type: resin
    grade_class: 通用型（悬浮法）
    verify: unverified
    aliases: [SG8, SG 8, 8型, 八型, PVC SG8]
    summary: 分子量最低的通用 PVC 型号，流动性好，用于透明片、硬质注塑件（管件等）。
    description: |
      SG-8 分子量低、熔体好流动，适合**注塑**（管件、接头）和透明硬片。
      同样是国标 GB/T 5761 的型号。K 值来自贸易商页面，只作参考。
    sources:
