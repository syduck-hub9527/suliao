  # ================= ABS =================
  - code: "0215A"
    manufacturer: 吉林石化
    material: ABS
    grade_class: 通用级
    verify: unverified
    aliases: [ABS 0215A, 吉化 0215A, 0215]
    summary: 吉林石化（中国石油）的 ABS 牌号，在 ABS 行情报价里经常和 750A、GE-150 一起出现。
    description: |
      吉林石化是国内主要的 ABS 生产企业。据 SunSirs 2024 年的报道，吉林石化新建的 20 万吨/年本体法和 40 万吨/年乳液法 ABS 装置
      计划 2025 年上半年交付，届时 ABS 总产能将达到 180 万吨/年（报道称国内第一）。
