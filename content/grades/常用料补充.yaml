  # ================= PP 无规共聚（PPR 管材） =================
  - code: RA130E
    full_name: Borealis RA130E
    manufacturer: 北欧化工
    material: PP-R
    grade_class: 管材级（冷热水管）
    verify: verified
    aliases: [Borealis RA130E, 北欧化工 RA130E]
    summary: 北欧化工的低熔指 PP-R，用于挤出冷热水管和注塑管件。MFR 0.25。
    description: |
      家里装修用的 **PPR 冷热水管**就是用这类料做的。管材料的熔指都非常低（这里只有 0.25），
      因为分子量高，管子才耐长期内压、耐热水。和注塑料动不动十几、几十的熔指差别很大。
    sources:
      - {id: web, title: "RA130E 产品页", url: "https://www.borealisgroup.com/products/product-catalogue/ra130e-1", publisher: Borealis, kind: maker_web, accessed: 2026-11-10}
      - {id: pds, title: "RA130E Product Data Sheet", url: "https://www.borealisgroup.com/storage/Datasheets/ra130e/RA130E-PDS-REG_WORLD-EN-V4-PDS-WORLD-24418-PDS_RA130E_4_11032026.pdf", publisher: Borealis, kind: maker_doc, accessed: 2026-11-10}
    properties:
      - {prop: MFR, value: "0.25", unit: g/10min, conditions: "2.16kg（官网页面没写温度）", source: web}

  - code: RA140E
    full_name: Borstar RA140E
    manufacturer: 博禄
    brand: Borstar
    material: PP-R
    grade_class: 管材级（采暖、冷热水管）
    verify: partial
    aliases: [Borouge RA140E, 博禄 RA140E]
    summary: 博禄的 PP-R 管材料，高分子量、低熔指，加了 BNT 成核，用于采暖、给水管。
    description: |
      博禄（Borouge）是阿布扎比国家石油公司（ADNOC）和北欧化工从 1998 年起的合资公司，工厂在阿联酋鲁维斯，
      所以牌号写法和北欧化工很像（RA130E、RA140E 都是 RA 开头的无规共聚 PP）。
      2025 年 ADNOC 和北欧化工的母公司 OMV 宣布把博禄和北欧化工合并成 **Borouge Group International**，
      北欧化工官网现在也显示“Borealis is now Borouge International”。以后看到这几个名字，指的是同一个体系。
    sources:
