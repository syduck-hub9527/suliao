      - {id: tds, title: "Moplen HP500N B Technical Data Sheet（利安德巴赛尔 TDS，贸易商网站转载）", url: "https://www.chemdo.com/uploads/Moplen-HP500N-B_EN.pdf", publisher: LyondellBasell（Chemdo 网站转载）, kind: trader, accessed: 2026-11-10}
