grades:
  # ================= MPPO =================
  - code: PX9406
    full_name: NORYL PX9406
    manufacturer: 沙特基础工业
    brand: NORYL
    material: MPPO
    grade_class: 无填充，无卤阻燃
    verify: partial
    aliases: [NORYL PX9406, Noryl9406]
    summary: SABIC 的 PPE+PS 合金，无溴无氯阻燃，耐热、翘曲小、吸水低，用于电器、手机电脑、建筑零件。
    description: |
      NORYL 原是 GE 塑料的改性聚苯醚品牌，2007 年随 GE 塑料归 SABIC。厂家说 NORYL 是 PPO（聚苯醚）和聚苯乙烯的非结晶共混物。
      后缀里 P、K、V 等字母是在同一基础上改了某项特性（如 PX9406V 偏向光伏接线盒）；
      NORYL PPX 系列是 PPE+PP 合金，NORYL GTX 是 PPE+PA 合金（汽车翼子板常用），和普通 NORYL 不是一回事。
    sources:
