  # ================= PA12 =================
  - code: L2140
    full_name: VESTAMID L2140
    manufacturer: 赢创
    brand: VESTAMID
    material: PA12
    grade_class: 高黏度挤出级（管材）
    verify: partial
    aliases: [L2140 NC, VESTAMID L2140]
    summary: 赢创的 PA12 管材料，加了热、光稳定剂，用来挤出汽车油管等管材（DIN 73378 PA12-HL）。
    description: |
      VESTAMID 牌号规律（厂家手册原意）：**L 代表月桂内酰胺，也就是 PA12**；
      **前两位数字是基础树脂溶液黏度的 10 倍**（L21xx 比 L16xx 黏度高）；**第三位代表改性类型**：
      0 = 无添加的基础树脂（如 L1600、L1901），2 = 增塑，4 = 加稳定剂等；第四位只是区分。
    sources:
      - {id: l2140, title: "VESTAMID L2140 NC（UL Prospector）", url: "https://betaplastics.ulprospector.com/plastics/es/generics/22/materials/1005", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
      - &vest_mdc {id: vmdc2, title: "VESTAMID 牌号列表（Material Data Center）", url: "https://materialdatacenter.com/ms/en/Vestamid/Evonik+Operations+GmbH/656", publisher: Material Data Center, kind: other, accessed: 2026-11-10}
