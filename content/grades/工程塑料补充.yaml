  # ================= PPA =================
  - code: A-1133 HS
    full_name: Amodel A-1133 HS
    manufacturer: Syensqo
    brand: Amodel
    material: PPA
    grade_class: 33% 玻纤增强，热稳定
    verify: partial
    aliases: [A1133HS, A-1133HS, Amodel A1133]
    summary: Amodel 的 33% 玻纤 PPA，热稳定，热变形温度高、刚性和强度高、吸水低、抗蠕变好。
    description: |
      Amodel 是 Syensqo（原索尔维）的 PPA 品牌。从厂家牌号可以归纳出规律：A-1xxx 是基础系列，
      **第二位数字代表填料（1 = 玻纤，5 = 玻纤加矿物，6 = 碳纤加玻纤），最后两位是填充量**：
      A-1133 = 33% 玻纤，A-1145 = 45% 玻纤，A-1565 = 65% 玻纤加矿物。HS 是热稳定，BK 324 是黑色、NT 是本色。
    sources:
      - {id: a1133, title: "Amodel A-1133 HS（UL Prospector）", url: "https://betaplastics.ulprospector.com/plastics/en/datasheet/699/a-1133-hs", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
      - {id: amul, title: "Amodel 产品列表（UL Prospector 日文）", url: "https://betaplastics.ulprospector.com/plastics/ja/generics/22/materials/58", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
