grades:
  # ================= PEEK =================
  - code: 450G
    full_name: VICTREX PEEK 450G
    manufacturer: 威格斯
    brand: VICTREX
    material: PEEK
    grade_class: 通用级，标准黏度
    verify: verified
    summary: 威格斯的标准 PEEK 牌号，标准熔体黏度、中等分子量，用于注塑和挤出。
    description: |
      厂家把 450G 定义为“标准熔体黏度”的通用 PEEK。威格斯的牌号数字代表黏度档次：
      **90 < 150 < 450 < 650**，数字越小越好流动（适合薄壁），数字越大分子量越高、越韧。
      后缀 G 是粒料，P 是粗粉，PF 是细粉；GL30 是 30% 玻纤，CA30 是 30% 碳纤。
    sources: [*victrex_ds, *victrex_450g]
  - code: 150G
    full_name: VICTREX PEEK 150G
    manufacturer: 威格斯
    brand: VICTREX
    material: PEEK
    grade_class: 易流动注塑级
    verify: verified
    summary: 比 450G 更好流动的 PEEK，适合注塑薄壁和复杂零件。
    sources: [*victrex_pf, *victrex_450g]
  - code: 90G
    full_name: VICTREX PEEK 90G
    manufacturer: 威格斯
    brand: VICTREX
    material: PEEK
    grade_class: 极易流动注塑级
    verify: verified
    summary: 威格斯流动性最好的 PEEK 粒料之一，用于很薄、很复杂的注塑件。
    sources: [*victrex_pf]
  - code: 450GL30
    full_name: VICTREX PEEK 450GL30
    manufacturer: 威格斯
    brand: VICTREX
    material: PEEK
    grade_class: 30% 玻纤增强
    verify: verified
    summary: 标准流动、30% 玻纤增强的 PEEK，刚性和耐蠕变比纯 PEEK 高得多。
    sources: [*victrex_ds]
  - code: 450CA30
    full_name: VICTREX PEEK 450CA30
    manufacturer: 威格斯
    brand: VICTREX
    material: PEEK
    grade_class: 30% 碳纤增强
    verify: verified
    summary: 30% 碳纤增强的 PEEK，强度、刚性最高的一类，常替代金属结构件。
    sources: [*victrex_ds]
  - code: 150FC30
    full_name: VICTREX PEEK 150FC30
