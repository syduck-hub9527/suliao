  # ================= PPS =================
  - code: A504X90
    full_name: TORELINA A504X90
    manufacturer: 东丽
    brand: TORELINA
    material: PPS
    grade_class: 40% 玻纤增强，标准级
    verify: partial
    summary: 东丽的 40% 玻纤增强 PPS 标准牌号，用于开关、连接器、发电机部件和办公设备零件。
    description: |
      资料说明它是**支链型** PPS，40% 玻纤，耐热、阻燃、耐化学品，流动性和尺寸稳定性好。
      东丽 PPS 牌号的规律：A5xx 多为支链型，A6xx 多为线型；X90、X95 这类后缀区分不同改进点（X95 是低毛边）。
    sources:
      - {id: tsc, title: "TORELINA A504X90（SpecialChem）", url: "https://www.specialchem.com/plastics/product/toray-torelina-a504x90", publisher: SpecialChem, kind: other, accessed: 2026-11-10}
      - &toray_ul {id: tul, title: "东丽 PPS 产品列表（UL Prospector）", url: "https://plastics.ulprospector.com/plastics/de/generics/41/manufacturers/562?page=1", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
