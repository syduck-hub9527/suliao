    verify: verified
    summary: 易流动的耐磨 PEEK，加了 30% 碳纤、PTFE 和石墨，用于轴承、滑块、密封环。
    sources: [*victrex_pf]

  - code: KT-820 NT
    full_name: KetaSpire KT-820 NT
    manufacturer: Syensqo
    brand: KetaSpire
    material: PEEK
    grade_class: 低流动（高黏度）纯树脂
    verify: partial
    aliases: [KT-820, KT820]
    summary: Syensqo（原索尔维特种聚合物）的低流动纯 PEEK，本色粒料，用于注塑和挤出。
    description: |
      KetaSpire 的数字代表流动性：**KT-820 低流动，KT-850 中等，KT-880 高流动**。
      后缀 NT 是本色，BK 是黑色，GF30 是 30% 玻纤，CF30 是 30% 碳纤，P 是粗粉。
      2023 年 12 月索尔维把特种聚合物等业务分拆成独立上市公司 Syensqo，KetaSpire 随之归属 Syensqo。国内贸易商仍常叫它“索尔维”。
    sources: [*keta_ul, *keta_sc]
  - code: KT-880 NT
    full_name: KetaSpire KT-880 NT
    manufacturer: Syensqo
    brand: KetaSpire
    material: PEEK
    grade_class: 高流动纯树脂
    verify: partial
    aliases: [KT-880, KT880]
    summary: 高流动的纯 PEEK 本色粒料，适合薄壁注塑，也用于涂层。
    sources: [*keta_sc]
  - code: KT-880 GF30
