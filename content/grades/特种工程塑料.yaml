    description: |
      Ryton 是最早商业化的 PPS 品牌（原属菲利普斯石油，后归索尔维，现属 Syensqo）。
      牌号规律：**R-4 系列是 40% 玻纤**，R-7 系列是玻纤加矿物填充；后面的三位数区分改进点，
      比如 R-4-200 强度更好、R-4-220 耐热水、R-4-230 低毛边、R-4-240 更韧。
