  # ---------------- GPPS ----------------
  - code: PG-383
    full_name: POLYREX PG-383
    manufacturer: 奇美
    brand: POLYREX
    material: GPPS
    product_type: resin
    grade_class: 通用级
    lifecycle: active
    verify: unverified
    aliases: [PG383]
    summary: 奇美高强度通用级 PS（透苯），用于一次性餐具、食品容器、玩具、文具。
    description: |
      高强度的通用级聚苯乙烯（GPPS，俗称透苯），透明、轻、可注塑也可挤出。
      推荐用途：一次性餐具（勺、刀、叉）、食品容器、玩具、文具。

      这张表又是一个“条件决定数值”的例子：同一个 PG-383，
      - 熔指 200°C/5kg 是 2.2，220°C/10kg 就是 8.5；
      - 维卡软化温度按 ISO 306 的不同方法测，从 103 °C 到 110 °C 都有。
    sources:
      - {id: ss, title: POLYREX PG-383 物性表（转载 UL Prospector 数据）, url: "https://www.sushengpolymer.com/plasmain/6b2VQc_POLYREX-PG-383", publisher: 上海苏盛（贸易商）, kind: trader, accessed: 2026-11-08}
      - {id: sc, title: POLYREX PG-383 产品介绍, url: "https://www.specialchem.com/plastics/product/chi-mei-polyrex-pg-383", publisher: SpecialChem（数据库）, kind: other, accessed: 2026-11-08}
    properties:
      - {prop: 密度, value: "1.05", unit: g/cm³, standard: "ASTM D792, ISO 1183", source: ss, note: "原文写比重"}
      - {prop: MFR, value: "2.2", unit: g/10min, conditions: "200°C/5kg", standard: ASTM D1238, source: ss}
      - {prop: MFR, value: "8.5", unit: g/10min, conditions: "220°C/10kg", standard: ASTM D1238, source: ss}
      - {prop: MVR, value: "2.2", unit: cm³/10min, conditions: "200°C/5kg", standard: ISO 1133, source: ss}
      - {prop: HDT, value: "85", unit: °C, conditions: "1.8 MPa，未退火", standard: ISO 75-2/A, source: ss}
      - {prop: HDT, value: "99", unit: °C, conditions: "1.8 MPa，退火", standard: "ASTM D648, ISO 75-2/A", source: ss}
      - {prop: 维卡软化温度, value: "106", unit: °C, conditions: "A50（10 N，50°C/h）", standard: ISO 306, source: ss}
      - {prop: 维卡软化温度, value: "103", unit: °C, conditions: "B50（50 N，50°C/h）", standard: ISO 306, source: ss}
      - {prop: 阻燃等级（UL 94）, value: "HB", thickness_mm: 1.6, source: ss}

  # ---------------- HIPS ----------------
  - code: PH-88
    full_name: POLYREX PH-88
    manufacturer: 奇美
    brand: POLYREX
    material: HIPS
    product_type: resin
    grade_class: 高抗冲注塑级
    lifecycle: active
    verify: partial
    aliases: [PH88]
    summary: 奇美高抗冲 PS（HIPS，俗称改苯），用于家电外壳、玩具、日用品。
    description: |
      高抗冲聚苯乙烯（HIPS），在 PS 里引入橡胶相来提高韧性，代价是不再透明、刚性和耐热略降。
      对比同一家的透明 GPPS PG-383：都按 ISO 306 A 法，维卡软化温度从 106 °C 降到 96 °C 左右。

      同系列还有挤出级 PH-88S、高光泽 PH-888G 等，后缀不同性能不同。
    sources:
      - {id: mdc, title: POLYREX PH-88 数据表, url: "https://materialdatacenter.com/ms/en/Polyrex/Chi+Mei+Corporation/POLYREX+PH-88/b4aeee47/545", publisher: Material Data Center（M-Base 数据库）, kind: other, accessed: 2026-11-08}
    properties:
      - {prop: MVR, value: "5.5", unit: cm³/10min, conditions: "200°C/5kg", standard: ISO 1133, source: mdc}
      - {prop: MFR, value: "6", unit: g/10min, conditions: "200°C/5kg", standard: ASTM D1238, source: mdc}
      - {prop: 悬臂梁缺口冲击强度, value: "11", unit: kJ/m², conditions: "23°C", standard: ISO 180/1A, source: mdc}
      - {prop: 悬臂梁缺口冲击强度, value: "98.2", unit: J/m, conditions: "1/8 英寸试样", standard: ASTM D256, source: mdc}
      - {prop: 拉伸断裂强度, value: "23.5", unit: MPa, standard: ASTM D638, source: mdc}
      - {prop: 维卡软化温度, value: "96", unit: °C, conditions: "A 法", standard: ISO 306, source: mdc}
      - {prop: 维卡软化温度, value: "90", unit: °C, conditions: "B 法", standard: ISO 306, source: mdc}
