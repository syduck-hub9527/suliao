grades:
  - code: 1010
    full_name: Irganox 1010
    manufacturer: 巴斯夫
    brand: Irganox
    material: 抗氧剂
    product_type: additive
    grade_class: 受阻酚类主抗氧剂
    lifecycle: active
    verify: verified
    aliases: [Irganox 1010, 抗氧剂 1010]
    summary: 巴斯夫受阻酚类主抗氧剂，官方资料列出其适用树脂包括聚烯烃及多种工程聚合物。
    description: |
      BASF 官方产品资料将 Irganox 1010 描述为受阻酚类主抗氧剂，用于保护有机材料免受热氧化降解。官方页面列出聚乙烯、聚丙烯、聚丁烯、EVA、聚甲醛、聚酰胺、聚氨酯、聚酯、PVC、苯乙烯类聚合物和多种弹性体等应用方向。
      具体适用性仍应以对应树脂体系的最新 TDS/SDS 和试验为准。
    sources:
      - {id: irganox1010, title: "Irganox 1010 产品资料", url: "https://www.basf.com/us/en/products/dispersions-resins-additives/products/irganox/irganox-1010", publisher: BASF, kind: maker_web, accessed: 2026-11-10}

