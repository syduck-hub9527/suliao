# 生物降解塑料（PLA、PBAT、PBS、PHA）常用厂商和牌号。查阅日期 2026-11-10。

grades:
  - code: 4032D
    full_name: Ingeo 4032D
    manufacturer: NatureWorks
    brand: Ingeo
    material: PLA
    grade_class: 双向拉伸薄膜级
    verify: partial
    aliases: [Ingeo4032D, NatureWorks 4032D]
    summary: NatureWorks 的 PLA 薄膜料，可做双向拉伸膜（使用温度可到 150°C），光学性好，用于复合包装，加工前必须干燥。
    description: |
      NatureWorks 是主要的 PLA 生产商，品牌 Ingeo。从牌号可以归纳出第一位大致代表用途：
      **2 = 挤出/热成型片材，3 = 注塑，4 = 薄膜，6 = 纤维**；带 HP 的是加工中会结晶、耐热更高的牌号。
    sources:
      - &ingeo_ul {id: iul, title: "Ingeo 产品列表（UL Prospector）", url: "https://betaplastics.ulprospector.com/plastics/pt/generics/34/materials/1872", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
  - code: 2003D
    full_name: Ingeo 2003D
    manufacturer: NatureWorks
    brand: Ingeo
    material: PLA
    grade_class: 透明通用挤出级
    verify: partial
    aliases: [Ingeo2003D, NatureWorks 2003D]
    summary: 透明通用挤出级 PLA，高分子量，挤出片材后易热成型，用于乳品杯、透明食品盒、冷饮杯、餐具。
    sources:
      - *ingeo_ul
      - {id: i2003, title: "Ingeo 2003D（Entec，转载厂家说明）", url: "https://entecpolymers.com/en-US/products/100150054-natureworks-ingeo-2003d", publisher: Entec Polymers, kind: other, accessed: 2026-11-10}
  - code: 3001D
    full_name: Ingeo 3001D
    manufacturer: NatureWorks
    brand: Ingeo
    material: PLA
    grade_class: 透明注塑级
    verify: partial
    aliases: [Ingeo3001D]
    summary: 注塑用透明 PLA，适合热变形温度要求低于 49°C 的制品，如刀叉勺、杯、盘、化妆品包装。
