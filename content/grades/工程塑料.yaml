      - {prop: 拉伸屈服强度, value: "66", unit: MPa, conditions: "50 mm/min", standard: "ISO 527-1,-2", source: cov}
      - {prop: 拉伸屈服应变, value: "6.2", unit: "%", conditions: "50 mm/min", standard: "ISO 527-1,-2", source: cov}
      - {prop: 拉伸断裂强度, value: "70", unit: MPa, conditions: "50 mm/min", standard: "ISO 527-1,-2", source: cov}
      - {prop: 断裂伸长率, value: "130", unit: "%", conditions: "50 mm/min", standard: "ISO 527-1,-2", source: cov}
