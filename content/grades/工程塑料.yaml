# 工程塑料（PC、PA、POM）常见牌号。查阅日期 2026-11-08。

grades:
  # ---------------- PC ----------------
  - code: "2805"
    full_name: Makrolon 2805
    manufacturer: 科思创
    brand: Makrolon
    material: PC
    product_type: resin
    grade_class: 通用注塑级（中黏度）
    lifecycle: active
    verify: verified
    aliases: [Makrolon2805, 拜耳2805, PC 2805]
    summary: 科思创（原拜耳）中等黏度通用级 PC，易脱模，透明、半透明、不透明颜色都有。
    description: |
      厂家写法：MVR（300°C/1.2kg）9.0 cm³/10min，通用级，**中等黏度**，易脱模。

      **Makrolon 牌号的规律**：第二位数字大体代表黏度档次。2405 是低黏度（MVR 约 19，好流动，适合薄壁），
      2805 是中黏度（MVR 9），3105 黏度更高（更韧、更适合厚壁和挤出）。
      PC 的熔指一律在 **300°C/1.2kg** 下测，和 PP、PE 的测试条件完全不同，不能拿数字直接比。

      维卡软化温度来自 UL Prospector 转载的资料；其余数据来自科思创官网。
    sources:
      - {id: cov, title: Makrolon 2805 产品页, url: "https://solutions.covestro.com/nl/products/makrolon/makrolon-2805_57534382-00009647", publisher: Covestro, kind: maker_web, accessed: 2026-11-08}
      - {id: covja, title: Makrolon 2805 产品页（日文）, url: "https://solutions.covestro.com/ja/products/makrolon/makrolon-2805_57534382-00009647", publisher: Covestro, kind: maker_web, accessed: 2026-11-08}
      - {id: ul, title: "Makrolon 2805 数据表（UL Prospector，Protolabs 转载）", url: "https://www.protolabs.com/media/3z2llptj/makrolon-2805.pdf", publisher: UL Prospector, kind: other, accessed: 2026-11-08}
    properties:
