      - {prop: 断裂伸长率, value: "≥120", unit: "%", source: gtai}
      - {prop: 悬臂梁缺口冲击强度, value: "≥4.5", unit: kg·cm/cm, source: gtai}
      - {prop: HDT, value: "60", unit: °C, conditions: "原文写 1.86 kg/cm²，应为 18.6 kg/cm²（约 1.82 MPa）", source: gtai}
      - {prop: 阻燃等级（UL 94）, value: "HB", thickness_mm: 1.6, source: gtai}
