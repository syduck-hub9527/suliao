# 聚乙烯（PE）常见牌号。查阅日期 2026-11-08。

grades:
  - code: 2426H
    full_name: Lupolen 2426 H
    manufacturer: 利安德巴赛尔
    brand: Lupolen
    material: LDPE
    product_type: resin
    grade_class: 吹膜/流延膜级
    lifecycle: active
    verify: verified
    aliases: [Lupolen 2426H]
    summary: 含爽滑剂和开口剂的通用 LDPE 薄膜料，“2426H”这个牌号名在国内也很常见。
    description: |
      厂家说明：加了添加剂的低密度聚乙烯，含**爽滑剂**（芥酸酰胺）和**开口剂**（天然二氧化硅），
      加工性和力学性能平衡好，做出的薄膜光学性能好。用于吹膜和流延膜：袋子、食品包装膜、卫材膜、衬膜、收缩膜。
      厂家注明不用于医疗和药品用途。

      国内也有企业用同一个牌号名“2426H”生产 LDPE（见下面茂名石化的 2426H）。
      名字一样、数据接近，但**不是同一个产品**，报价和选料时要说清楚是哪家的。
    sources:
      - {id: lyb, title: Lupolen 2426H 产品页, url: "https://lyondellbasell.com/en/polymers/p/Lupolen-2426H/90121372-9e7b-4888-b14d-00410c344618", publisher: LyondellBasell, kind: maker_web, accessed: 2026-11-08}
    properties:
      - {prop: MFR, value: "1.9", unit: g/10min, conditions: "190°C/2.16kg", source: lyb}
      - {prop: 密度, value: "0.924", unit: g/cm³, source: lyb}
      - {prop: 拉伸模量, value: "260", unit: MPa, source: lyb}
      - {prop: 拉伸屈服强度, value: "11", unit: MPa, source: lyb}
      - {prop: 维卡软化温度, value: "94", unit: °C, conditions: "A/50", source: lyb}
      - {prop: 熔点, value: "111", unit: °C, conditions: "峰值熔点", source: lyb}
      - {prop: 雾度, value: "<8", unit: "%", conditions: "50 µm 薄膜", source: lyb}

