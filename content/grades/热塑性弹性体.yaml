  # ================= POE =================
  - code: "8150"
    full_name: ENGAGE 8150
    manufacturer: 陶氏
    brand: ENGAGE
    material: POE
    grade_class: 乙烯-辛烯共聚物
    verify: partial
    aliases: [Engage 8150, 陶氏 8150]
    summary: 陶氏的乙烯-辛烯 POE，流动性好，主要用作 PP、PE 的增韧剂，也用于电线电缆、TPO，可高填充、可过氧化物交联。
    description: |
      ENGAGE 是陶氏的 POE 品牌：**8xxx 是乙烯-辛烯共聚物，7xxx 是乙烯-丁烯共聚物**。
      选 POE 主要看密度（越低越软、增韧效果越强）和熔指。
    sources:
      - &engage_sc {id: esc, title: "ENGAGE 产品列表（SpecialChem）", url: "https://www.specialchem.com/polymer-additives/supplier/dow/engage", publisher: SpecialChem, kind: other, accessed: 2026-11-10}
