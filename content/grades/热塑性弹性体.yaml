# 热塑性弹性体（SBS、SEBS、TPV、TPEE、POE）常用厂商和牌号。查阅日期 2026-11-10。
# TPU 的牌号在 弹性体.yaml 里。

grades:
  # ================= SBS =================
  - code: D1101
    full_name: Kraton D1101
    manufacturer: 科腾
    brand: Kraton
    material: SBS
    grade_class: 线型 SBS，苯乙烯 31%
    verify: partial
    aliases: [D-1101, Kraton D1101]
    summary: 科腾的经典线型 SBS，苯乙烯含量 31%，透明，用于胶粘剂、密封胶、沥青改性、鞋材和塑料增韧。
    description: |
      科腾牌号规律：**D 系列是不加氢的 SBS/SIS，G 系列是加氢的 SEBS/SEPS**。
      牌号后面的字母（如 AIM、KIM、JO）只区分产地和形态（粉、颗粒、多孔粒、是否撒粉）。
    sources:
      - {id: d1101, title: "Kraton D1101 系列（SpecialChem）", url: "https://adhesives.specialchem.com/searchsites/searchproducts/pf-powder/s-kraton/z-north-america", publisher: SpecialChem, kind: other, accessed: 2026-11-10}
      - {id: d1101k, title: Kraton D1101 产品页, url: "https://kraton.com/zh/polymers/d1101/", publisher: Kraton, kind: maker_web, accessed: 2026-11-10}
  - code: YH-791
    full_name: 巴陵石化 SBS YH-791（SBS1301）
    manufacturer: 巴陵石化
    material: SBS
    grade_class: 线型 SBS，苯乙烯/丁二烯 30/70
    verify: unverified
    aliases: [SBS1301, YH791, 791, 791H, YH-791H]
    summary: 巴陵石化的线型 SBS，苯乙烯/丁二烯约 30/70，用于沥青改性、胶粘剂、鞋材。
    description: |
      国内 SBS 有两套叫法：**巴陵石化的 YH-79x 系列** 和 **国标式的 SBS1301、SBS1401、SBS4402** 等，两者常对照使用：
      YH-791 ≈ SBS1301（线型，30/70），YH-792 ≈ SBS1401（线型，40/60），YH-796 ≈ SBS1201（线型，20/80）；
      SBS4xxx 多为星型（支化）结构。具体以厂家最新质量标准为准。
    sources:
      - {id: yh791, title: "SBS 牌号对照表（化工平台商家资料）", url: "https://m.chemicalbook.com/ProductDetail_EN_thermoplastic-styrene-butadiene-rubber-sbs_2842149.htm", publisher: ChemicalBook 商家, kind: trader, accessed: 2026-11-10}
      - {id: yh791e, title: "Baling SBS YH-791E 资料（Palmer Holland）", url: "https://palmerholland.com/getmedia/18e93f52-cfc8-4507-b4d3-fc6d271cc59a/MITM15476", publisher: Palmer Holland, kind: other, accessed: 2026-11-10}

