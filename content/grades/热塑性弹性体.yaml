  # ================= TPV =================
  - code: 101-64
    full_name: Santoprene 101-64
    manufacturer: 塞拉尼斯
    brand: Santoprene
    material: TPV
    grade_class: 软质通用级，黑色
    verify: verified
    aliases: [101-64, Santoprene 101-64]
    summary: Santoprene 的软质黑色通用 TPV，邵氏 A 硬度约 70（15 秒），用于密封件、电器零件、汽车防尘罩。
    description: |
      Santoprene 原属埃克森美孚，2021 年底卖给塞拉尼斯。它是在 PP 里分散了完全硫化的 EPDM 橡胶颗粒。
      牌号规律：**101 系列黑色通用，201 系列可配色**；横线后的数字大致是硬度档次（64、73、80、87…），数字越大越硬。
    sources:
      - {id: s10164, title: "SANTOPRENE 101-64 数据表（塞拉尼斯材料库，Protolabs 转载）", url: "https://protolabs.com/media/q2xlvfpk/santoprene-101-64-gb.pdf", publisher: Celanese, kind: maker_doc, accessed: 2026-11-10}
      - {id: santo_w, title: "Thermoplastic vulcanizates（Wikipedia）", url: "https://en.wikipedia.org/wiki/Thermoplastic_vulcanizates", publisher: Wikipedia, kind: other, accessed: 2026-11-10}
  - code: 101-87
    full_name: Santoprene 101-87
    manufacturer: 塞拉尼斯
    brand: Santoprene
    material: TPV
    grade_class: 硬质通用级，黑色
    verify: partial
    aliases: [Santoprene 101-87]
    summary: 硬质黑色 TPV，耐臭氧、耐化学品，常用于汽车玻璃导槽等密封系统的硬质部分。
    sources:
      - {id: s10187, title: "Santoprene 101-87（UL Prospector）", url: "https://betaplastics.ulprospector.com/plastics/en/datasheet/244476/santoprene-101-87", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
