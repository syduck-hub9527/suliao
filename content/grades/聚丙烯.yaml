  - code: K8003
    producers: 中国石化燕山石化、上海赛科（据中国石化产品资料）；中国石油独山子石化也有同名牌号登记 UL 黄卡
    material: PP-B
    product_type: resin
    grade_class: 注塑级
    lifecycle: active
    verify: unverified
    aliases: [PP K8003]
    summary: 低熔指的抗冲共聚 PP，刚韧平衡好，常用于负重件、周转箱、汽车零件。
    description: |
      抗冲共聚聚丙烯（PP-B），在均聚 PP 里分散了乙丙橡胶相，所以比均聚 PP 耐冲击得多，尤其是低温冲击。
      熔指比较低（约 2.5），适合需要韧性的厚壁注塑件，资料写的用途是负重部件和汽车部件。

      有一篇期刊论文专门比较了 K8303、K8003 和 EPS-30R 三种低熔指共聚 PP：
      K8303、K8003 的橡胶相含量更高、球晶更小，所以冲击韧性明显更好。
      这说明：同样叫“共聚 PP”，橡胶相多少会直接决定耐冲击能力。

      下面的数据来自贸易商网页，只能当参考。原网页把冲击强度单位写成了 kJ/m³，应是 kJ/m² 的笔误；
      网页上还写了一个 23°C 冲击值，和同页其他说法对不上，这里没有收录。
