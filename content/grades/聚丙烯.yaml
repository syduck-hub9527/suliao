# 聚丙烯（PP）常见牌号。查阅日期 2026-11-08。

grades:
  - code: T30S
    full_name: PPH-T03（T30S）
    producers: 中国石化九江、镇海、中天、石家庄炼化等（据贸易商转载的中国石化 TDS）；其他石化企业也有同名产品
    material: PP-H
    product_type: resin
    grade_class: 拉丝级
    lifecycle: active
    verify: unverified
    aliases: [PPH-T03, T03, PP T30S]
    summary: 国内 PP 拉丝料的代表牌号，编织袋的主要原料；PP 现货行情里最常被报价的牌号之一。
    description: |
      均聚聚丙烯拉丝料。中国石化的规范叫法是 **PPH-T03**，市场上一直沿用老名字 **T30S**。

      主要用途是**扁丝编织**：编织袋（装化肥、水泥、粮食、饲料）、集装袋（吨袋）、篷布、地毯底布、绳索。
      这类用途要求拉伸强度高、拉丝稳定，所以资料里最重要的指标是熔体流动速率、拉伸屈服强度和等规指数。

      **这张表是学“保证值”和“典型值”区别的好例子**：同一项指标有两行——
      - 保证值（质量指标），例如拉伸屈服强度“≥30.0 MPa”，是厂家承诺每批都能达到的底线；
      - 典型值，例如“32.7 MPa”，是平时测出来的常见水平，不是承诺。
      给客户做承诺时只能引用保证值。

      各家工厂的 T30S 指标略有不同，下面的数据来自贸易商转载的中国石化资料，以具体工厂的质检单为准。
