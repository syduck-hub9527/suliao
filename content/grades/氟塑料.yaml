      - {id: cg1, title: "CGM 031-1（SpecialChem）", url: "https://www.specialchem.com/plastics/product/chenguang-research-institute-of-chemical-industry-cgm-031-1", publisher: SpecialChem, kind: other, accessed: 2026-11-10}
  - code: CGF218H
    full_name: 晨光 CGF218H
    manufacturer: 中昊晨光
    material: PTFE
    grade_class: 分散树脂（细粉），糊状挤出
    verify: verified
    aliases: [CGF 218H, CGF218]
    summary: 国产 PTFE 分散树脂（细粉），和溶剂油拌成糊状后挤出，做生料带、管、电线包覆等。
    description: |
      中昊晨光的 PTFE 分散树脂牌号有 CGF218、CGF238、CGF2021、CGF2022、CGF219、CGF216 等系列（厂家资料原文）。
      模压用的悬浮树脂则是 CGM 开头。
