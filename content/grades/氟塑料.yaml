  # ================= PVDF =================
  - code: "720"
    full_name: Kynar 720
    manufacturer: 阿科玛
    brand: Kynar
    material: PVDF
    grade_class: 均聚物，标准注塑粒料
    verify: partial
    aliases: [Kynar720, Kynar 720]
    summary: 阿科玛 PVDF 的标准注塑粒料，耐化学品、不怕紫外线、阻隔性好、纯度高，有饮用水（NSF 61）认证。
    description: |
      Kynar 是阿科玛的 PVDF 品牌（另有共聚物 Kynar Flex）。**720 是粒料，721 是同一树脂的粉料**；
      740 黏度更高、也是高纯均聚物，常用于化工塔填料、管道、板材。
    sources:
      - {id: k720, title: "Kynar 720（UL Prospector 中文）", url: "https://plastics.ulprospector.com/plastics/zh-cn/datasheet/5791/kynar-720", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
      - &arkema_tp {id: arktp, title: 阿科玛：塔填料用 Kynar 常用牌号, url: "https://hpp.arkema.com/en/markets-and-applications/chemical-industry-and-general-industry/chemical-process-industry-overview/tower-packing", publisher: Arkema, kind: maker_web, accessed: 2026-11-10}
  - code: "740"
    full_name: Kynar 740
    manufacturer: 阿科玛
    brand: Kynar
    material: PVDF
    grade_class: 均聚物，高纯
    verify: verified
    aliases: [Kynar740]
    summary: 高纯 PVDF 均聚物，加了光、热稳定，耐化学品、耐紫外，化工设备里很常用。
    sources:
      - *arkema_tp
      - {id: k740, title: Kynar 740 产品页, url: "https://hpp.arkema.com/en/products/product/f/flup_hpp_Kynar/p/kynar-740", publisher: Arkema, kind: maker_web, accessed: 2026-11-10}

  - code: "1008"
    full_name: Solef 1008
    manufacturer: Syensqo
    brand: Solef
    material: PVDF
    grade_class: 低黏度均聚物，注塑
    verify: partial
    aliases: [Solef1008]
    summary: Solef 低黏度 PVDF 均聚物，主要用于注塑。
    description: |
      Solef 牌号规律：**最后两位代表黏度档次，08 低黏度（注塑），10 中黏度（挤出），12 高黏度（挤出/模压）**。
      1008 和 6008 是两个不同聚合工艺的低黏度注塑级；5130、5140 是锂电池粘结剂用的超高黏度级。
    sources:
      - &solef_ul {id: sul, title: "PVDF 产品列表（UL Prospector）", url: "https://plastics.ulprospector.com/plastics/es/generics/14/classifications/23?page=5", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
  - code: "6010"
    full_name: Solef 6010
    manufacturer: Syensqo
    brand: Solef
    material: PVDF
    grade_class: 中黏度均聚物，挤出
    verify: partial
    aliases: [Solef6010]
    summary: Solef 中黏度 PVDF 均聚物，一般用于挤出管、板。
    sources: [*solef_ul]

  - code: T#1100
    full_name: KF Polymer #1100
    manufacturer: 吴羽
    brand: KF Polymer
    material: PVDF
    grade_class: 均聚物，中黏度
    verify: verified
    aliases: [KF1100, KF 1100, "#1100", T1100]
    summary: 吴羽的中黏度 PVDF 均聚物，挤出和模压用，耐化学品。
    description: |
      吴羽 1970 年在日本率先工业化生产 PVDF。KF Polymer 的数字越大分子量（黏度）越高：#850、#1000、#1100、#1300…；
      **牌号前加 T 是粒料，加 W 是粉料**，L 开头是液体（溶液）。
      **W#1100、W#7200 等是锂电池电极粘结剂**——吴羽说从 1991 年第一块商用锂电池起就在用。
    sources:
      - &kureha {id: kur, title: KF Polymer 牌号与物性, url: "https://www.kureha.co.jp/en/business/material/kfpolymer/line-up_properties.html", publisher: Kureha, kind: maker_web, accessed: 2026-11-10}
      - {id: kur2, title: KF Polymer 简介, url: "https://www.kureha.co.jp/en/business/material/kfpolymer.html", publisher: Kureha, kind: maker_web, accessed: 2026-11-10}
  - code: W#7200
    full_name: KF Polymer W#7200
    manufacturer: 吴羽
    brand: KF Polymer
    material: PVDF
    grade_class: 锂电池粘结剂（粉料），高分子量
    verify: verified
    aliases: [W7200, KF W7200]
    summary: 吴羽的锂电池电极粘结剂用 PVDF 粉料，高分子量均聚物。
    sources:
      - {id: kbd, title: KF Polymer 电极粘结剂资料, url: "https://www.kureha.co.jp/en/business/material/pdf/KFpolymer_BD_en.pdf", publisher: Kureha, kind: maker_doc, accessed: 2026-11-10}

