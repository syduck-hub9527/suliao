# 氟塑料（PTFE、PVDF、FEP、PFA）常用厂商和牌号。查阅日期 2026-11-10。
# PTFE 不能像普通塑料那样熔融注塑，牌号先按“形态”分：悬浮树脂（模压料）、分散树脂（细粉，糊状挤出）、分散液（乳液，浸渍涂层）。

grades:
  # ================= PTFE =================
  - code: 7A X
    full_name: Teflon PTFE 7A X
    manufacturer: 科慕
    brand: Teflon
    material: PTFE
    grade_class: 悬浮树脂（模压料），细粒径
    verify: partial
    aliases: [7AX, Teflon 7A, 杜邦 7A]
    summary: 科慕（原杜邦氟化工）的 PTFE 模压粉，白色细粒径，压力不高也能压出少气孔的坯料。
    description: |
      科慕是 2015 年从杜邦分拆出来的公司，“特氟龙 Teflon”品牌随之归科慕，所以老一辈常说“杜邦 7A”。
      科慕 PTFE 大致分：**7A、7C、807N 是模压/柱塞挤出用的悬浮树脂**，**60、62、6C、613A、640XT 等是糊状挤出用的分散树脂（细粉）**。
      牌号后的 X 只是库存管理用的标记，带不带 X 是同一个产品。
    sources:
      - &chem_site {id: chs, title: "科慕网站产品检索结果（Teflon PTFE 7A X 等）", url: "https://chemours.com/fr/site-search-results?pg=227", publisher: Chemours, kind: maker_web, accessed: 2026-11-10}
      - &teflon_mdc {id: tmdc, title: "Teflon 牌号列表（Material Data Center）", url: "https://materialdatacenter.com/ms/en/Teflon/The+Chemours+Company/824", publisher: Material Data Center, kind: other, accessed: 2026-11-10}
  - code: 62 X
    full_name: Teflon PTFE 62 X
    manufacturer: 科慕
    brand: Teflon
    material: PTFE
    grade_class: 分散树脂（细粉），糊状挤出
    verify: partial
    aliases: [62X, Teflon 62]
    summary: 科慕的高端 PTFE 细粉，糊状挤出用，压缩比 100:1～600:1，主要做高要求的管材、细管和电线包覆。
    sources:
      - {id: t62, title: "Teflon PTFE 62 X（UL Prospector）", url: "https://betaplastics.ulprospector.com/plastics/es/datasheet/13200/teflon-ptfe-62-x", publisher: UL Prospector, kind: other, accessed: 2026-11-10}
      - *teflon_mdc

  - code: M-12
    full_name: POLYFLON PTFE M-12
    manufacturer: 大金
    brand: POLYFLON
    material: PTFE
    grade_class: 悬浮树脂（模压粉），常规级
    verify: verified
    aliases: [M12, 大金 M-12]
    summary: 大金常规 PTFE 模压粉，平均粒径约 50 μm，适合压制成型（不适合自动压制）。
    description: |
      大金 PTFE 品牌叫 **POLYFLON**，按形态分系列：**M 系列是模压粉（悬浮法），F 系列是细粉（分散法，糊状挤出），D 系列是分散液**。
      M-12、M-18 是常规级；M-111、M-112、M-139 是改性的新一代，抗蠕变和可焊性更好。
      熔融可加工的氟树脂（PFA、FEP、ETFE 等）则用另一个品牌 **NEOFLON**。
    sources:
      - &daikin_m {id: dkm, title: POLYFLON PTFE-M 产品手册, url: "https://www.daikinchem.de/sites/default/files/pdf/PTFE-M/Product%20Brochure%20POLYFLON%20PTFE-M.pdf", publisher: Daikin, kind: maker_doc, accessed: 2026-11-10}
  - code: M-111
    full_name: POLYFLON PTFE M-111
    manufacturer: 大金
    brand: POLYFLON
    material: PTFE
    grade_class: 改性模压粉
    verify: verified
    aliases: [M111]
    summary: 大金新一代改性 PTFE 模压粉，比常规 M-12 抗蠕变、可焊性更好。
    sources: [*daikin_m]
  - code: F-104
    full_name: POLYFLON PTFE F-104
    manufacturer: 大金
    brand: POLYFLON
    material: PTFE
    grade_class: 细粉（分散树脂），均聚
    verify: partial
    aliases: [F104]
    summary: 大金的通用 PTFE 细粉，均聚物，用于糊状挤出，符合 FDA 21 CFR 177.1550。
    sources:
      - {id: f104, title: "POLYFLON 产品列表（SpecialChem）", url: "https://www.specialchem.com/plastics/supplier/daikin/polyflon", publisher: SpecialChem, kind: other, accessed: 2026-11-10}
      - {id: dktds, title: 大金技术数据表目录, url: "https://www.daikinchemicals.com/downloads/technical-data-sheets.html", publisher: Daikin, kind: maker_web, accessed: 2026-11-10}

  - code: CGM031-1
    full_name: 晨光 CGM 031-1
    manufacturer: 中昊晨光
    material: PTFE
    grade_class: 悬浮树脂（模压料），中等粒径
    verify: partial
    aliases: [CGM 031-1, CGM031]
    summary: 国产 PTFE 模压料，中等粒径，压制后烧结，用来做板、棒、管和垫片。
