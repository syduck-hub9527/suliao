  - code: AP-201
    full_name: NEOFLON PFA AP-201
    manufacturer: 大金
    brand: NEOFLON
    material: PFA
    grade_class: 高流动工业级
    verify: verified
    aliases: [AP201]
    summary: 大金高流动 PFA，适合注塑形状复杂的零件和挤出薄壁电线。
    description: |
      大金 PFA 分**工业级**和**半导体级（带 SH，高纯）**两类。AP-201 高流动，AP-210 好流动（注塑和挤出），
