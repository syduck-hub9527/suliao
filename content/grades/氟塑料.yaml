    manufacturer: 科慕
    brand: Teflon
    material: PFA
    grade_class: 通用级粒料
    verify: partial
    aliases: [PFA340, "340"]
    summary: 科慕的通用 PFA 粒料，熔指较高（典型 14），用来挤出管材、电线绝缘，也能注塑和模压。
