{# 侧边栏里的参考价。用法：{% include "kb/_price_side.html" with rows=price_rows %} #}
{% if rows %}
  <div class="card">
    <h3>市场参考价</h3>
    {% for r in rows %}
      <div class="prow"><span>{{ r.title }}</span><span><b>{{ r.price }}</b> <span class="muted small">{{ r.unit }}</span></span></div>
      <div class="pdate">{% if r.is_today %}<span class="badge green">今天</span>{% else %}<span class="badge amber">不是今天 · {{ r.date_label }}</span>{% endif %}</div>
    {% endfor %}
  </div>
{% endif %}
